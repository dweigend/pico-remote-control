# Purpose: Validate every runnable example on GitHub pushes and pull requests.
# Context: Hardware behavior remains a separate manual gate documented in docs/validation.md.
# Responsibilities: Install Bun and run the repository-owned non-hardware check script.
# Boundaries: Does not access a PICO headset, ADB USB transport, or scrcpy video.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Run repository checks
        run: ./scripts/check.sh
